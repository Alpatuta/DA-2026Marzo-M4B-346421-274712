<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MalaPATA — Ingresar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="loginJugador.css" />
</head>

<body>

    <div class="login-card">

        <div class="brand">
            <span class="brand-icon">🐴</span>
            <span class="brand-name">MalaPATA</span>
            <span class="brand-sub">Zona de jugadores — Hipódromo MalaPata</span>
        </div>

        <p id="mensajeError" class="error-msg"></p>

        <div class="form-group">
            <label class="form-label" for="nombreUsuario">Nombre de usuario</label>
            <input class="form-input" type="text" id="nombreUsuario" placeholder="Tu nombre de usuario" autocomplete="username" />
        </div>

        <div class="form-group">
            <label class="form-label" for="contrasenia">Contraseña</label>
            <input class="form-input" type="password" id="contrasenia" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button class="btn-submit" id="btnIngresar">Ingresar</button>

        <p class="card-footer">Hipódromo MalaPata &copy; 2026</p>

    </div>

    <script type="module">
        import dispatcher from '/CommandDispatcher.js';

        const view = dispatcher.registerView('loginJugador', {
            urlInicio: null,
            onException: (msg) => {
                const el = document.getElementById('mensajeError');
                el.textContent = msg;
                el.style.display = 'block';
            }
        });

        view.handler('accesoPermitido', (url) => { window.location.href = url; });

        dispatcher.startView(view);

        document.getElementById('btnIngresar').addEventListener('click', () => {
            document.getElementById('mensajeError').style.display = 'none';
            dispatcher.submit('/loginJugador/ingresar', {
                nombreUsuario: document.getElementById('nombreUsuario').value,
                contrasenia: document.getElementById('contrasenia').value
            });
        });
    </script>

</body>

</html>
