<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>MalaPata</title>
    <link rel="stylesheet" href="../estilos.css" />
</head>

<body>
    <h1>Panel de Jugador</h1>
    <p>Hipódromo MalaPata — Sistema Jugador</p>

    <label>Nombre de usuario</label>
    <input type="text" id="nombreUsuario" />

    <label>Contraseña</label>
    <input type="password" id="contrasenia" />

    <button id="btnIngresar">Ingresar al sistema</button>
    <p id="mensajeError" style="display:none; color:red;"></p>
    <p>Por seguridad, no se permite el ingreso simultáneo con las mismas credenciales.</p>

    <script type="module">
        import dispatcher from '/CommandDispatcher.js';

        const view = dispatcher.registerView('loginJugador', {
            urlInicio: null,
            onException: (msg) => {
                document.getElementById('mensajeError').textContent = msg;
                document.getElementById('mensajeError').style.display = 'block';
            }
        });

        view.handler('accesoPermitido', (url) => { window.location.href = url; });

        dispatcher.startView(view);

        document.getElementById('btnIngresar').addEventListener('click', () => {
            document.getElementById('mensajeError').style.display = 'none';
            dispatcher.submit('/loginJugador/ingresar', {
                nombreUsuario: document.getElementById('nombreUsuario').value,
                contrasenia: document.getElementById('contrasenia').value
            });
        });
    </script>
</body>

</html>
