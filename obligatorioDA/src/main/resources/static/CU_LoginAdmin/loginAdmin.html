<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración — MalaPata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="loginAdmin.css" />
</head>

<body>

    <div class="page-wrapper">

        <div class="system-label">Panel de Administración</div>

        <div class="login-card">

            <div class="brand">
                <span class="brand-badge">🔒 Acceso restringido</span>
                <span class="brand-name">Hipódromo MalaPata</span>
                <span class="brand-sub">Sistema de gestión interno</span>
            </div>

            <p id="mensajeError" class="error-msg"></p>

            <div class="form-group">
                <label class="form-label" for="nombreUsuario">Usuario</label>
                <input class="form-input" type="text" id="nombreUsuario" placeholder="Nombre de usuario" autocomplete="username" />
            </div>

            <div class="form-group">
                <label class="form-label" for="contrasenia">Contraseña</label>
                <input class="form-input" type="password" id="contrasenia" placeholder="••••••••" autocomplete="current-password" />
            </div>

            <div class="notice">
                <span class="notice-icon">⚠️</span>
                <span>Por seguridad, no se permite el ingreso simultáneo con las mismas credenciales desde distintas sesiones.</span>
            </div>

            <button class="btn-submit" id="btnIngresar">Acceder al sistema</button>

        </div>

        <p class="page-footer">Hipódromo MalaPata &copy; 2026 — Solo personal autorizado</p>

    </div>

    <script type="module">
        import dispatcher from '/CommandDispatcher.js';

        const view = dispatcher.registerView('loginAdmin', {
            urlInicio: null,
            onException: (msg) => {
                const el = document.getElementById('mensajeError');
                el.textContent = msg;
                el.style.display = 'block';
            }
        });

        view.handler('accesoPermitido', (url) => { window.location.href = url; });

        dispatcher.startView(view);

        document.getElementById('btnIngresar').addEventListener('click', () => {
            document.getElementById('mensajeError').style.display = 'none';
            dispatcher.submit('/loginAdmin/ingresar', {
                nombreUsuario: document.getElementById('nombreUsuario').value,
                contrasenia: document.getElementById('contrasenia').value
            });
        });
    </script>

</body>

</html>
